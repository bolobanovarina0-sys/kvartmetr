{% extends "base.html" %}
{% block title %}Вход — {{ brand.name }}{% endblock %}
{% block content %}
<main class="auth">
  <form class="card auth-card" method="post">
    <h2>Вход в личный кабинет</h2>
    <p class="muted">Здесь ваши квартиры, датчики и расходы.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Войти</button>
    <p class="muted center">Ещё нет аккаунта? <a class="link" href="{{ url_for('register') }}">Зарегистрироваться</a></p>
  </form>
</main>
{% endblock %}
